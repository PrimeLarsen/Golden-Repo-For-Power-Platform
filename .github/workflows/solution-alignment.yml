name: Solution ALM (export → check → deploy)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack managed solution
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: src/ProjektKundportal
          solution-file: artifacts/ProjektKundportal_managed.zip
          solution-type: Managed

      - name: Solution Checker
        uses: microsoft/powerplatform-actions/check-solution@v1
        with:
          solution-file: artifacts/ProjektKundportal_managed.zip

      - name: Import til test
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ secrets.POWERPLATFORM_URL }}
          tenant-id: ${{ secrets.POWERPLATFORM_TENANT_ID }}
          app-id: ${{ secrets.POWERPLATFORM_CLIENT_ID }}
          client-secret: ${{ secrets.POWERPLATFORM_CLIENT_SECRET }}
          solution-file: artifacts/ProjektKundportal_managed.zip
          run-asynchronously: true
